name: EAS Build (preview)

# Requires an EXPO_TOKEN secret in this repo's Settings > Secrets and
# variables > Actions, generated from an Expo access token
# (https://expo.dev/accounts/[account]/settings/access-tokens) with
# permission to build this project. Until that secret is added, this
# workflow will fail at the "eas build" step -- CI above (typecheck/lint)
# is unaffected and still gates PRs on its own.
#
# Sentry source maps: app.config.js already includes the
# "@sentry/react-native/expo" config plugin, but it has no org/project/auth
# token configured anywhere (checked 2026-09-03: no SENTRY_AUTH_TOKEN,
# SENTRY_ORG, or SENTRY_PROJECT in this repo, no sentry.properties file).
# That means every "eas build" here silently skips source-map upload --
# crashes in Sentry show minified stack traces instead of real file/line
# info. This is NOT a GitHub Actions secret: the plugin's upload step runs
# inside the EAS cloud build container (this workflow just triggers it via
# --no-wait), so it needs an EAS secret instead:
#   eas secret:create --scope project --name SENTRY_AUTH_TOKEN --value <token>
#   eas secret:create --scope project --name SENTRY_ORG --value <org-slug>
#   eas secret:create --scope project --name SENTRY_PROJECT --value <project-slug>
# Generate the auth token at https://sentry.io/settings/account/api/auth-tokens/
# (needs project:releases scope). Once set, no further changes are needed
# here -- the config plugin picks them up automatically during the build.

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (Android, preview profile)
        run: eas build --platform android --profile preview --non-interactive --no-wait
